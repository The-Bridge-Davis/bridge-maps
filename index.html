<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="importmap">
    {
      "imports": {
        "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
        "leaflet-extra-markers": "https://unpkg.com/leaflet-extra-markers@2.0.1/src/index.js",
        "leaflet-extra-markers/": "https://unpkg.com/leaflet-extra-markers@2.0.1/src/"
      }
    }
    </script>
</head>
<body>
    <div id="map"></div>

    <div id="welcome" class="welcome" role="dialog" aria-labelledby="welcome-title">
        <h2 id="welcome-title" class="welcome__title">Welcome to Bridge to the Nations!</h2>
        <p class="welcome__text">
            This map shows where the Bridge family is spread across the world.
            Click a pin to see who is there and how you can pray for them.
        </p>
        <button id="welcome-close" class="welcome__close" type="button" aria-label="Dismiss">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" />
            </svg>
        </button>
    </div>

    <button id="world-view-btn" class="world-button" type="button">
        <!-- globe -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18" />
            <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18Z" />
        </svg>
        World view
    </button>

    <aside id="panel" class="panel" aria-label="Prayer request" inert>
        <button id="panel-close" class="panel__close" type="button"
                aria-label="Close and return to world view">
            <!-- right arrow -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 5l7 7-7 7" />
            </svg>
        </button>

        <div class="panel__body">
            <h1 id="panel-headline" class="panel__headline"></h1>
            <div id="panel-photo" class="panel__photo"></div>
            <p class="panel__label">Prayer needs</p>
            <p id="panel-description" class="panel__description"></p>
        </div>
    </aside>

    <script type="module" src="js/app.js"></script>
</body>
</html>
